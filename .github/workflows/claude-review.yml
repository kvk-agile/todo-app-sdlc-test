name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash(gh pr comment:*)"
          prompt: |
            Please review this pull request. Check the code against
               requirements.md for completeness and correctness, look for bugs,
               and comment on code quality.

               IMPORTANT: Post your entire review as a single top-level
               comment on the pull request (visible in the Conversation tab),
               not as inline comments on specific lines. Use the GitHub CLI
               (gh pr comment) or equivalent to post it as one plain comment.
